appId: com.pdfworkspace.app
productName: PDF Workspace
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraMetadata:
  main: out/main/index.js
win:
  target:
    - nsis
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  installerLanguages:
    - ko_KR
    - en_US
  shortcutName: PDF Workspace
