appId: com.pdfworkspace.app
productName: 더존 PDF 편집기
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: assets/fonts
    to: assets/fonts
    filter: ['**/*.ttf']
extraMetadata:
  main: out/main/index.js
win:
  icon: build/icon.ico
  executableName: 더존 PDF 편집기
  target:
    - nsis
    - dir
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  installerLanguages:
    - ko_KR
    - en_US
  shortcutName: 더존 PDF 편집기
